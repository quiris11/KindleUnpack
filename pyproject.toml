[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kindleunpack"
version = "0.83"
description = "Unpack Kindle/Mobipocket ebooks (MOBI, AZW, AZW3, AZW4) to their source files"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.6"

[project.scripts]
kindleunpack = "kindleunpack.kindleunpack:main"

[tool.setuptools]
packages = ["kindleunpack"]
package-dir = { kindleunpack = "lib" }
